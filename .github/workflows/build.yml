# WebAPK Stüdyo v4 - Build Workflow (otomatik kurulur, elle dokunma)
name: Build APK
on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-apk]

permissions:
  contents: write
  actions: write

concurrency:
  group: build-group
  cancel-in-progress: true

env:
  APP_NAME: ${{ github.event.client_payload.app_name }}
  PACKAGE_NAME: ${{ github.event.client_payload.package_name }}
  VERSION_NAME: ${{ github.event.client_payload.version_name }}
  THEME_COLOR: ${{ github.event.client_payload.theme_color }}
  JS_ENABLED: ${{ github.event.client_payload.js_enabled }}
  INTERNET: ${{ github.event.client_payload.internet }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Android sablonunu uret
        run: |
          set -euo pipefail
          mkdir -p ".github" "app/src/main/java" "app/src/main/res/values" "app/src/main/assets/app" "app/src/main/assets" "studio"
          echo '' | base64 -d > settings.gradle
          echo 'cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguNS4yJyBhcHBseSBmYWxzZQp9Cg==' | base64 -d > build.gradle
          echo 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bQphbmRyb2lkLnVzZUFuZHJvaWRYPXRydWUKYW5kcm9pZC5ub25UcmFuc2l0aXZlUkNsYXNzPXRydWUK' | base64 -d > gradle.properties
          echo '' | base64 -d > app/build.gradle
          echo '' | base64 -d > app/src/main/AndroidManifest.xml
          echo '' | base64 -d > app/src/main/java/MainActivity.java
          echo 'PHJlc291cmNlcz4KICAgIDxzdHJpbmcgbmFtZT0iYXBwX25hbWUiPl9fQVBQX05BTUVfXzwvc3RyaW5nPgo8L3Jlc291cmNlcz4K' | base64 -d > app/src/main/res/values/strings.xml
          echo 'PHJlc291cmNlcz4KICAgIDxjb2xvciBuYW1lPSJ0aGVtZSI+X19USEVNRV9DT0xPUl9fPC9jb2xvcj4KPC9yZXNvdXJjZXM+Cg==' | base64 -d > app/src/main/res/values/colors.xml
          echo '' | base64 -d > app/src/main/res/values/styles.xml
          echo '' | base64 -d > app/src/main/assets/index.html
          APP_NAME="${APP_NAME:-WebAPK Uygulamasi}"
          PACKAGE_NAME="${PACKAGE_NAME:-com.webapk.app}"
          VERSION_NAME="${VERSION_NAME:-1.0}"
          THEME_COLOR="${THEME_COLOR:-#4F46E5}"
          JS_ENABLED="${JS_ENABLED:-true}"
          INTERNET="${INTERNET:-true}"
          export APP_NAME PACKAGE_NAME VERSION_NAME THEME_COLOR JS_ENABLED INTERNET
          PKG_DIR=$(echo "$PACKAGE_NAME" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_DIR"
          mv app/src/main/java/MainActivity.java "app/src/main/java/$PKG_DIR/MainActivity.java"
          sed -i "s/__PACKAGE_NAME__/$PACKAGE_NAME/g" "app/src/main/java/$PKG_DIR/MainActivity.java" app/build.gradle
          sed -i "s/__APP_NAME__/$APP_NAME/g" app/src/main/res/values/strings.xml
          sed -i "s/__THEME_COLOR__/$THEME_COLOR/g" app/src/main/res/values/colors.xml app/src/main/res/values/styles.xml
          sed -i "s/__JS_ENABLED__/$JS_ENABLED/g" "app/src/main/java/$PKG_DIR/MainActivity.java"
          sed -i "s/__VERSION_NAME__/$VERSION_NAME/g" app/build.gradle
          if [ "$INTERNET" = "true" ]; then
            sed -i 's|__INTERNET_PERM__|<uses-permission android:name="android.permission.INTERNET"/>|' app/src/main/AndroidManifest.xml
          else
            sed -i 's|__INTERNET_PERM__|<!-- INTERNET KAPALI -->|' app/src/main/AndroidManifest.xml
          fi
          echo "DERLEME: $APP_NAME / $PACKAGE_NAME / v$VERSION_NAME"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK bilesenleri
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true; sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle wrapper
        run: |
          which gradle || (sudo apt-get update && sudo apt-get install -y gradle)
          gradle wrapper --gradle-version 8.9

      - name: APK derle
        run: ./gradlew assembleDebug --stacktrace

      - name: APK'yi Release'e yukle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-latest --cleanup-tag -y || true
          gh release create build-latest app/build/outputs/apk/debug/app-debug.apk \
            --title "Son APK" --notes "Otomatik derleme - $APP_NAME"
            
