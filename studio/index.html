<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tıkla Kazan</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    background: linear-gradient(135deg, #1e1b4b, #4c1d95);
    color: #fff; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px;
  }
  h1 { font-size: 28px; margin-bottom: 8px; }
  .skor { font-size: 48px; font-weight: 800; margin: 16px 0; color: #fbbf24; }
  .btn {
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    border: none; color: #fff; font-size: 22px; font-weight: 800;
    padding: 24px 48px; border-radius: 20px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(239,68,68,.4);
    transition: transform .1s;
  }
  .btn:active { transform: scale(.92); }
  .btn:disabled { opacity: .4; }
  .rekor { margin-top: 20px; opacity: .8; font-size: 14px; }
  #mesaj { margin-top: 12px; font-size: 18px; color: #86efac; min-height: 24px; }
</style>
</head>
<body>
  <h1>🎯 Tıkla Kazan</h1>
  <p>10 saniyede en çok sen tıkla!</p>
  <div class="skor" id="skor">0</div>
  <button class="btn" id="btn">TIKLA!</button>
  <div id="mesaj"></div>
  <p class="rekor">🏆 Rekor: <span id="rekor">0</span></p>

<script>
  var skor = 0, rekor = 0, sure = 10, oynuyor = false, sayac;
  try { rekor = parseInt(localStorage.getItem('rekor')) || 0; } catch(e) {}
  document.getElementById('rekor').textContent = rekor;

  var btn = document.getElementById('btn');
  btn.addEventListener('click', function () {
    if (!oynuyor) {
      oynuyor = true; skor = 0; sure = 10;
      document.getElementById('skor').textContent = '0';
      document.getElementById('mesaj').textContent = '';
      btn.textContent = 'TIKLA!';
      sayac = setInterval(function () {
        sure--;
        btn.textContent = 'TIKLA! (' + sure + ')';
        if (sure <= 0) {
          clearInterval(sayac); oynuyor = false;
          btn.textContent = 'YENİDEN OYNA';
          if (skor > rekor) {
            rekor = skor;
            try { localStorage.setItem('rekor', rekor); } catch(e) {}
            document.getElementById('rekor').textContent = rekor;
            document.getElementById('mesaj').textContent = '🎉 YENİ REKOR!';
          } else {
            document.getElementById('mesaj').textContent = 'Süre doldu!';
          }
        }
      }, 1000);
      return;
    }
    skor++;
    document.getElementById('skor').textContent = skor;
  });
</script>
</body>
</html>
